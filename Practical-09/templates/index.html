
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Banknote Authentication | Linear SVM</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 25px;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #dbeafe, #e9d5ff);
        }

        .container {
            background: white;
            width: 100%;
            max-width: 560px;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 8px 28px rgba(0, 0, 0, 0.12);
        }

        h1 {
            text-align: center;
            color: #1e3a8a;
            margin-top: 0;
        }

        .subtitle {
            text-align: center;
            color: #64748b;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin: 15px 0 6px;
            font-weight: bold;
            color: #334155;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #cbd5e1;
            border-radius: 7px;
            font-size: 16px;
        }

        input:focus {
            outline: 2px solid #93c5fd;
            border-color: #2563eb;
        }

        button {
            width: 100%;
            margin-top: 24px;
            padding: 14px;
            border: none;
            border-radius: 8px;
            background: #2563eb;
            color: white;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        #result {
            display: none;
            margin-top: 22px;
            padding: 18px;
            border-radius: 8px;
            text-align: center;
            overflow-wrap: anywhere;
        }

        .genuine {
            background: #dcfce7;
            color: #166534;
        }

        .counterfeit {
            background: #fee2e2;
            color: #991b1b;
        }

        .error {
            background: #fef3c7;
            color: #92400e;
        }

        .note {
            margin-top: 20px;
            font-size: 12px;
            color: #64748b;
            line-height: 1.5;
        }
    </style>
</head>

<body>
<div class="container">
    <h1>Banknote Authentication</h1>

    <p class="subtitle">Linear Support Vector Machine (SVM)</p>

    <form id="predictionForm">
        <label for="variance">Variance</label>
        <input type="number" step="any" id="variance" required>

        <label for="skewness">Skewness</label>
        <input type="number" step="any" id="skewness" required>

        <label for="curtosis">Curtosis</label>
        <input type="number" step="any" id="curtosis" required>

        <label for="entropy">Entropy</label>
        <input type="number" step="any" id="entropy" required>

        <button type="submit" id="predictButton">
            Classify Banknote
        </button>
    </form>

    <div id="result" role="status" aria-live="polite"></div>

    <p class="note">
        This educational model predicts from numerical image features.
        It does not directly scan a banknote or provide official
        authentication of currency.
    </p>
</div>

<script>
    const form = document.getElementById("predictionForm");
    const result = document.getElementById("result");
    const button = document.getElementById("predictButton");

    form.addEventListener("submit", async function(event) {
        event.preventDefault();

        result.style.display = "block";
        result.className = "";
        result.textContent = "Predicting...";
        button.disabled = true;

        const payload = {
            Variance: document.getElementById("variance").value,
            Skewness: document.getElementById("skewness").value,
            Curtosis: document.getElementById("curtosis").value,
            Entropy: document.getElementById("entropy").value
        };

        try {
            const response = await fetch("/predict", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify(payload)
            });

            const data = await response.json();

            if (!response.ok) {
                throw new Error(data.error || "Prediction failed.");
            }

            result.className =
                data.class === 0 ? "genuine" : "counterfeit";

            result.textContent = "Result: " + data.prediction;
        } catch (error) {
            result.className = "error";
            result.textContent = error.message ||
                "Unable to connect to the Flask server.";
        } finally {
            button.disabled = false;
        }
    });
</script>
</body>
</html>
